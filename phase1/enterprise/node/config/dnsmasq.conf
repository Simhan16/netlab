# Acme's internal DNS server (dnsmasq, run by roles/dns.sh).

listen-address=10.10.20.10
bind-interfaces
# run as an account that exists in every Ubuntu image
user=nobody
group=nogroup
# ignore /etc/resolv.conf: upstreams are listed below
no-resolv
# ...and ignore /etc/hosts: records are listed below
no-hosts
server=1.1.1.1
server=8.8.8.8
log-queries
# log to stderr, so `docker logs dns` shows every query
log-facility=-

# corp.acme is ours: answer from here, never forward it.
local=/corp.acme/
domain=corp.acme

host-record=dns.corp.acme,10.10.20.10
host-record=intranet.corp.acme,10.10.20.20
host-record=jumpbox.corp.acme,10.10.99.10
host-record=ws1.corp.acme,10.10.10.11
host-record=ws2.corp.acme,10.10.10.12
host-record=bws1.corp.acme,10.20.10.11
host-record=core-rtr.corp.acme,10.10.10.1
host-record=edge-fw.corp.acme,10.255.0.1
host-record=branch-fw.corp.acme,10.20.10.1
host-record=proxy.corp.acme,172.16.10.20
host-record=www-internal.corp.acme,172.16.10.10

# Split-horizon DNS: on the internet, www.acme.example would be the public address
# 203.0.113.10. Inside, staff get the server's real DMZ address instead, so their
# traffic doesn't have to hairpin through the firewall's NAT (exercise 6).
host-record=www.acme.example,172.16.10.10
