! core-rtr: advertises HQ's internal segments into OSPF and learns everything else
! (the DMZ, the branch, VPN clients and the default route) from edge-fw.
frr defaults traditional
hostname core-rtr
log syslog informational
!
interface transit
 ip ospf hello-interval 5
 ip ospf dead-interval 20
!
! Passive: advertise the subnet, but don't send hellos to the workstations on it.
interface users
 ip ospf passive
!
interface servers
 ip ospf passive
!
interface mgmt
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.2
 network 10.255.0.0/24 area 0
 network 10.10.10.0/24 area 0
 network 10.10.20.0/24 area 0
 network 10.10.99.0/24 area 0
!
line vty
!
