! branch-fw: one OSPF neighbor, edge-fw, across the VPN. Learns all of HQ plus the
! default route from it, and advertises the branch LAN back.
frr defaults traditional
hostname branch-fw
log syslog informational
!
interface wg-site
 ip ospf network point-to-point
 ip ospf hello-interval 5
 ip ospf dead-interval 20
!
interface lan
 ip ospf passive
!
router ospf
 ospf router-id 10.255.1.2
 network 10.255.1.0/30 area 0
 network 10.20.10.0/24 area 0
!
line vty
!
