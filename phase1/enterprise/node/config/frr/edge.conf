! edge-fw: OSPF area 0 with core-rtr (over transit) and branch-fw (over the VPN).
! It also tells everyone "send internet traffic to me": default-information originate.
frr defaults traditional
hostname edge-fw
log syslog informational
!
interface transit
 ip ospf hello-interval 5
 ip ospf dead-interval 20
!
interface wg-site
 ! A WireGuard tunnel has no broadcast/ARP, so it's a point-to-point OSPF link (no DR election).
 ip ospf network point-to-point
 ip ospf hello-interval 5
 ip ospf dead-interval 20
!
interface dmz
 ip ospf passive
!
interface wg-ra
 ip ospf passive
!
router ospf
 ospf router-id 10.255.0.1
 network 10.255.0.0/24 area 0
 network 10.255.1.0/30 area 0
 network 10.255.2.0/24 area 0
 network 172.16.10.0/24 area 0
 default-information originate always
!
line vty
!
