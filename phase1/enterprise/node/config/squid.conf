# Acme's web proxy (Squid, run by roles/proxy.sh). Staff reach the web only through here.

http_port 3128
pid_filename /run/squid.pid
# a policy-and-logging proxy, not a cache
cache deny all
access_log stdio:/var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
coredump_dir /var/spool/squid
# the DMZ uses public resolvers, not internal DNS
dns_nameservers 1.1.1.1 8.8.8.8

acl staff src 10.10.0.0/16 10.20.0.0/16
acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT
# Company policy: this site is blocked (stand-in for a URL-filtering category).
acl blocked dstdomain .example.org

http_access deny !Safe_ports
http_access deny CONNECT !SSL_ports
http_access deny blocked
http_access allow staff
http_access deny all
