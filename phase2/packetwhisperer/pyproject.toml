[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.13"]
build-backend = "scikit_build_core.build"

[project]
name = "packetwhisperer"
version = "0.1.0"
description = "Upload a pcap, get a plain-English root cause."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=2.3",
  "pydantic>=2.5",
  "fastapi>=0.110",
  "python-multipart>=0.0.9",
  "uvicorn>=0.29",
  "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
packetwhisperer = "packetwhisperer.cli:main"

[tool.scikit-build]
cmake.version = ">=3.16"
wheel.packages = ["service/packetwhisperer"]
build-dir = "build/{wheel_tag}"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
